# Checks every relative link and #anchor in the repo's Markdown, offline.
# External URLs are never fetched, so the result depends only on this repo.
# Tracked in docs/TRACKING.md under issue #21.
name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  links:
    name: relative links and anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: lychee (offline, with fragments)
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            --verbose
            README.md
            AGENTS.md
            '.cursor/rules/*.mdc'
            'docs/**/*.md'
          fail: true
